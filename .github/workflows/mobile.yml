# Builds the phone apps in the cloud.
#  - Android: an installable demo APK (sample data, no server needed) → download from the run's "Artifacts".
#  - iOS: compiles the app for the iPhone simulator to prove the project builds.
#    A signed TestFlight build needs the Apple Developer account (see MOBILE.md).
name: Mobile apps

on:
  push:
    paths: ['client/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

jobs:
  android-demo-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:app-demo
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: client/android
      - uses: actions/upload-artifact@v4
        with:
          name: creator-club-demo-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk

  # Proves the release signing setup works, with a throwaway key (the real one is only used by android-play.yml)
  android-release-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:app
      - run: npx cap sync android
      - name: Signed release bundle with a throwaway key
        working-directory: client/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/throwaway.p12
          ANDROID_KEYSTORE_PASSWORD: throwaway-password
          ANDROID_VERSION_CODE: '7'
          ANDROID_VERSION_NAME: '0.0.7'
        run: |
          keytool -genkeypair -storetype PKCS12 -keystore "$ANDROID_KEYSTORE_FILE" -alias upload -keyalg RSA -keysize 2048 \
            -validity 1 -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" -dname "CN=check"
          ./gradlew bundleRelease --no-daemon
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -2

  ios-compile:
    runs-on: macos-15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build:app
      - run: npx cap sync ios
      - name: Build for simulator (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
